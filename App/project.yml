# Generate the Xcode project with `xcodegen` from this folder (scripts/build-app.sh does it).
name: AnkiMac
options:
  bundleIdPrefix: io.github.davidmaniliuc
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  AnkiKit:
    path: ../AnkiKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  AnkiMac:
    type: application
    platform: macOS
    sources:
      - path: AnkiMac
      # Upstream's built web assets (reviewer.js, MathJax, CSS, Svelte pages),
      # served to the card view under /_anki/. Built by scripts/build-backend.sh.
      - path: ../anki/out/qt/_aqt/data/web
        name: web
        type: folder
        buildPhase: resources
      # MathJax's SVG build, for the editor's rendered maths (the reviewer
      # uses the CommonHTML build in web/).
      - path: ../anki/node_modules/mathjax/es5/tex-svg-full.js
        buildPhase: resources
    # Finder hands .apkg/.colpkg to the app, which imports them (File > Import).
    info:
      path: AnkiMac/Info.plist
      properties:
        NSMicrophoneUsageDescription: AnkiMac records from the microphone when you use Record Audio in the note editor.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Anki Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeExtensions: [apkg, colpkg]
    dependencies:
      - package: AnkiKit
        product: AnkiKit
      - package: AnkiKit
        product: FieldEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.davidmaniliuc.AnkiMac
        PRODUCT_NAME: AnkiMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AnkiMac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: AGPL-3.0-or-later
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
