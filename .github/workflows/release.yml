# Builds AnkiMac.app, packs it into a DMG and publishes a GitHub release.
#
# A release is a TAG: pushing vMAJOR.MINOR.PATCH (scripts/release.sh picks the
# next one and pushes it) builds that commit as that version and publishes it.
# The tag must point at a commit on master. Running the workflow by hand
# (Actions > Release > Run workflow) only builds the DMG and attaches it to the
# run as an artifact; it never tags or publishes.
#
# The release is titled with its commit, "AnkiMac 0.1.0 (a3f91c2)", and its
# build number (CFBundleVersion, what Sparkle compares) is the commit count,
# so it only ever goes up along master.
#
# Each release is also published to Sparkle's update feed (the appcast
# branch's appcast.xml), signed with the SPARKLE_PRIVATE_KEY secret, and to
# the Homebrew tap. See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Every release is a GitHub pre-release while the app is alpha. Set this to
  # "false" when a release should be shown as Latest.
  PRERELEASE: "true"
  # The Sparkle release whose sign_update signs the DMG. Keep it the version
  # App/project.yml pins.
  SPARKLE_VERSION: "2.10.0"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Xcode 27, what the app is developed on. The deployment target stays
    # 26.0. GitHub still lists this image as a preview; move to "macos-27"
    # once that label exists.
    runs-on: xcode-27
    timeout-minutes: 120
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      # The whole history: the build number is the commit count, and the tag
      # is checked against master. anki/ and its ftl submodules are the backend.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Work out the version
        id: version
        run: |
          # CFBundleShortVersionString allows three integers and nothing else,
          # and Homebrew needs a version that sorts, so the commit goes in the
          # release title instead.
          build="$(git rev-list --count HEAD)"
          commit="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not a release tag; tag vMAJOR.MINOR.PATCH, e.g. v0.1.0."
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::$GITHUB_REF_NAME points at $commit, which is not on master."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "stamp=$version" >> "$GITHUB_OUTPUT"
          else
            # A test build keeps the project's own version; only its DMG's
            # name says it is not a release.
            version="$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' App/project.yml | head -1)-dev.$build"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "commit=$commit"
            echo "anki=$(git rev-parse HEAD:anki)"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, build $build ($commit)"

      # In-app updates are on only when both halves of the key are stored: the
      # public key (an Actions VARIABLE) goes into the app, the private one (a
      # SECRET) signs the feed. A pair that does not match would ship an app
      # that rejects every update, so that fails here, before anything builds.
      - name: Check the Sparkle keys
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            if [ -n "$SPARKLE_PUBLIC_ED_KEY" ]; then
              echo "::error::SPARKLE_PUBLIC_ED_KEY is set but the SPARKLE_PRIVATE_KEY secret is not: the app would look for updates nobody can sign."
              exit 1
            fi
            echo "::notice::No Sparkle keys stored; this build will not update itself (docs/RELEASING.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret is set but the SPARKLE_PUBLIC_ED_KEY variable is not."
            exit 1
          fi
          # The exported private key is the base64 32-byte Ed25519 seed, so
          # CryptoKit derives the same public key generate_keys printed.
          cat > "$RUNNER_TEMP/derive.swift" <<'EOF'
          import CryptoKit
          import Foundation
          let text = (readLine() ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
          guard let seed = Data(base64Encoded: text), seed.count == 32,
                let key = try? Curve25519.Signing.PrivateKey(rawRepresentation: seed) else { exit(2) }
          print(key.publicKey.rawRepresentation.base64EncodedString())
          EOF
          if ! derived="$(printf '%s\n' "$SPARKLE_PRIVATE_KEY" | swift "$RUNNER_TEMP/derive.swift")"; then
            echo "::error::SPARKLE_PRIVATE_KEY is not a base64 32-byte key; export it with 'generate_keys -x'."
            exit 1
          fi
          if [ "$derived" != "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::error::SPARKLE_PUBLIC_ED_KEY does not match SPARKLE_PRIVATE_KEY."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # scripts/build-app.sh signs with "AnkiMac Development" when the keychain
      # has it: a stable signature is what keeps the saved AnkiWeb login
      # across updates. Without the secret, releases stay ad-hoc.
      - name: Import the signing certificate
        env:
          CERT: ${{ secrets.ANKIMAC_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.ANKIMAC_SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::notice::No ANKIMAC_SIGNING_CERT stored; this build is ad-hoc signed and loses the AnkiWeb login on update (docs/RELEASING.md)."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning | grep -q '"AnkiMac Development"' || {
            echo "::error::ANKIMAC_SIGNING_CERT holds no \"AnkiMac Development\" identity."; exit 1; }

      - name: Tools
        run: |
          xcodebuild -version
          brew install protobuf swift-protobuf ninja xcodegen
          # rust-toolchain.toml pins the toolchain; this installs it.
          rustup show active-toolchain || rustup toolchain install

      # The Rust backend and upstream's web build are most of the time; reuse
      # them while Cargo.lock and the anki submodule stay put.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            anki/out
            anki/node_modules
          key: backend-${{ steps.version.outputs.anki }}-${{ hashFiles('Cargo.toml', 'bridge/**', 'swiftgen/**') }}
          restore-keys: backend-${{ steps.version.outputs.anki }}-

      - name: Build the backend
        run: scripts/build-backend.sh

      - name: Build AnkiMac.app
        env:
          ANKIMAC_VERSION: ${{ steps.version.outputs.stamp }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: scripts/build-app.sh

      - name: Pack the DMG
        id: dmg
        run: |
          scripts/package-dmg.sh "${{ steps.version.outputs.version }}"
          echo "sha256=$(cut -d' ' -f1 "out/AnkiMac-${{ steps.version.outputs.version }}.dmg.sha256")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AnkiMac-${{ steps.version.outputs.version }}
          path: |
            out/AnkiMac-*.dmg
            out/AnkiMac-*.dmg.sha256
          if-no-files-found: error

      - name: Publish the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          cat > notes.md <<'EOF'
          > [!WARNING]
          > AnkiMac is **alpha** software: back up your collection before pointing it at one you care about, and expect missing features. Apple silicon and macOS 26 or later only.

          ### Install

          **Homebrew:** `brew install --cask davidmaniliuc/tap/anki-mac`

          **DMG:** open it and drag AnkiMac to Applications. The app is not notarized yet, so the first launch is blocked: open **System Settings ▸ Privacy & Security** and click **Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/AnkiMac.app`.
          EOF
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          echo "" >> notes.md
          echo "Built from $GITHUB_SHA." >> notes.md
          gh release create "$GITHUB_REF_NAME" \
            "out/AnkiMac-$VERSION.dmg" \
            "out/AnkiMac-$VERSION.dmg.sha256" \
            --verify-tag \
            --title "AnkiMac $VERSION ($COMMIT)" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"

      # After the release, so the enclosure URL already resolves. The feed
      # holds the newest release only: Sparkle compares sparkle:version (the
      # build number) with the installed CFBundleVersion.
      - name: Publish the update feed
        if: steps.version.outputs.publish == 'true' && steps.sparkle.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          gh release download "$SPARKLE_VERSION" --repo sparkle-project/Sparkle \
            --pattern "Sparkle-$SPARKLE_VERSION.tar.xz" --dir "$tools"
          tar -xJf "$tools/Sparkle-$SPARKLE_VERSION.tar.xz" -C "$tools"

          dmg="out/AnkiMac-$VERSION.dmg"
          # Prints: sparkle:edSignature="..." length="..."
          signature="$(printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$tools/bin/sign_update" --ed-key-file - "$dmg")"
          case "$signature" in
            sparkle:edSignature=*) ;;
            *) echo "::error::sign_update printed no signature"; exit 1 ;;
          esac

          repo_url="https://github.com/$GITHUB_REPOSITORY"
          page="$repo_url/releases/tag/v$VERSION"
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>AnkiMac</title>
              <link>$repo_url</link>
              <item>
                <title>AnkiMac $VERSION ($COMMIT)</title>
                <pubDate>$(date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <link>$page</link>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <description><![CDATA[
                  <p>AnkiMac $VERSION, built from commit <a href="$repo_url/commit/$GITHUB_SHA">$COMMIT</a>. Alpha software: back up your collection.</p>
                  <p><a href="$page">Full release notes on GitHub</a></p>
                ]]></description>
                <enclosure url="$repo_url/releases/download/v$VERSION/AnkiMac-$VERSION.dmg" type="application/octet-stream" $signature />
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout appcast.xml

          # The feed lives on its own orphan branch, served raw (Info.plist's
          # SUFeedURL), so a release never commits to the source branches.
          mkdir feed && cd feed
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin appcast 2>/dev/null; then
            git checkout -q -b appcast FETCH_HEAD
          else
            git checkout -q --orphan appcast
          fi
          cp ../appcast.xml appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -q -m "appcast: AnkiMac $VERSION ($COMMIT)"
          git push -q origin appcast

  homebrew:
    # Runs only once a token for davidmaniliuc/homebrew-tap is stored as
    # HOMEBREW_TAP_TOKEN (docs/RELEASING.md). Without it this job is skipped,
    # not failed.
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for the tap token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          repository: davidmaniliuc/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump Casks/anki-mac.rb
        if: steps.token.outputs.present == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          # The cask lives in the tap: only its version and sha256 lines are
          # rewritten, so everything else in it is edited there by hand.
          cask=tap/Casks/anki-mac.rb
          if [ ! -f "$cask" ]; then
            echo "::error::$cask is missing; add the cask to davidmaniliuc/homebrew-tap first (docs/RELEASING.md)."
            exit 1
          fi
          sed -i -E \
            -e "s/^(  version )\".*\"/\1\"$VERSION\"/" \
            -e "s/^(  sha256 )\".*\"/\1\"$SHA256\"/" \
            "$cask"
          grep -q "^  version \"$VERSION\"" "$cask" && grep -q "^  sha256 \"$SHA256\"" "$cask" || {
            echo "::error::could not find the version/sha256 lines in $cask"; exit 1; }
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/anki-mac.rb
          if git diff --cached --quiet; then
            echo "Cask already at $VERSION"
            exit 0
          fi
          git commit -m "anki-mac $VERSION"
          git push
